<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCUH 비대상 · 사용자 입력 시험</title>
<style>
  :root { color-scheme: light dark; font: 17px/1.5 system-ui, sans-serif; }
  body { max-width: 720px; margin: 64px auto; padding: 0 24px; }
  .tag { color: #b07514; font-weight: 700; }
  textarea { box-sizing: border-box; width: 100%; min-height: 240px; font: 18px/1.6 ui-monospace, monospace; padding: 20px; border: 2px solid #b78a32; border-radius: 12px; }
  label { display: block; margin: 28px 0 10px; font-weight: 700; }
  .note { font-size: 14px; opacity: .8; }
</style>
<main>
  <p class="tag">CCUH LAB · 비대상 탭</p>
  <h1>사용자 입력 시험</h1>
  <p>에이전트가 다른 목표 탭에서 작업하는 동안 아래 입력란에서 정해진 테스트 문자열을 계속 입력하세요.</p>
  <p>예: <code>ccuh-input-01 ccuh-input-02 ccuh-input-03</code></p>
  <label for="typing">사용자 테스트 입력</label>
  <textarea id="typing" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="테스트 문자열만 입력하세요. 실제 메시지·비밀번호·개인정보는 입력하지 마세요."></textarea>
  <p id="recording" role="status" aria-live="polite">로컬 이벤트 기록 준비 중</p>
  <p class="note">이 페이지 자신의 포커스·표시 상태·입력·선택 범위만 로컬 메모리에 기록합니다.
    다른 앱의 입력이나 화면은 읽지 않습니다. 에이전트는 이 페이지의 내용과 평가 로그를 읽지 않아야 합니다.</p>
</main>
<script>
  const textarea = document.querySelector('#typing');
  const recording = document.querySelector('#recording');
  let queue = Promise.resolve();
  let eventCount = 0;
  let deliveryFailures = 0;
  let clientSequence = 0;
  const pageId = crypto.randomUUID();
  let lastSelection = '';
  function snapshot() {
    return {
      value: textarea.value,
      selection_start: textarea.selectionStart,
      selection_end: textarea.selectionEnd,
      focused: document.activeElement === textarea,
      visibility: document.visibilityState,
      page_id: pageId,
      client_sequence: ++clientSequence,
      client_time_ms: Date.now(),
      client_monotonic_ms: Math.round(performance.now()),
    };
  }
  function showRecordingStatus() {
    recording.textContent = deliveryFailures
      ? `로컬 이벤트 ${eventCount}건 기록 · 전송 실패 ${deliveryFailures}건 · 이 시행은 측정 불완전`
      : `로컬 이벤트 ${eventCount}건 기록`;
  }
  function record(event) {
    const payload = { source: 'user', event, data: snapshot() };
    queue = queue.then(async () => {
      const response = await fetch('/events', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload), keepalive: true,
      });
      if (!response.ok) throw new Error('Event delivery failed');
      eventCount++;
      showRecordingStatus();
    }).catch(() => { deliveryFailures++; showRecordingStatus(); });
  }
  textarea.addEventListener('focus', () => record('focus'));
  textarea.addEventListener('blur', () => record('blur'));
  textarea.addEventListener('input', () => record('input'));
  document.addEventListener('selectionchange', () => {
    if (document.activeElement !== textarea) return;
    const current = `${textarea.selectionStart}:${textarea.selectionEnd}:${textarea.value.length}`;
    if (current !== lastSelection) { lastSelection = current; record('selectionchange'); }
  });
  window.addEventListener('focus', () => record('window_focus'));
  window.addEventListener('blur', () => record('window_blur'));
  document.addEventListener('visibilitychange', () => record('visibilitychange'));
  record('page_ready');
</script>
</html>

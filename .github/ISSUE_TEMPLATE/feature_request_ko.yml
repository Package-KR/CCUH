name: '[한국어] 기능 제안'
description: CCUH 기능이나 Computer Use 작업 흐름의 개선을 제안합니다.
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        개선하고 싶은 작업 흐름을 설명합니다. 예시나 첨부 자료에 포함된 인증정보와 비공개 내용은 가립니다.
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제나 사용 사례
      description: 기능을 제안하게 된 불편이나 달성하고 싶은 목표를 설명합니다.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 CCUH의 동작과 그 동작이 어떤 도움이 되는지 설명합니다.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법
      description: 사용 중인 우회 방법이나 고려한 다른 접근 방식이 있다면 작성합니다.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 관련 앱과 창 또는 데스크탑 상황, 예시나 참고 자료를 첨부합니다.
    validations:
      required: false

name: '[한국어] 버그 신고'
description: CCUH 설치, 훅 실행 또는 앱과 창 선택 문제를 제보합니다.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        CCUH를 사용하면서 발생한 문제를 작성합니다. 로그나 스크린샷을 첨부할 때는 인증정보와 비공개 내용을 가립니다.
  - type: textarea
    id: problem
    attributes:
      label: 발생한 문제
      description: 발생한 문제와 CCUH 또는 Computer Use의 실제 동작을 설명합니다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 수행한 작업과 관련 앱, 문제가 발생하기까지의 조작 순서를 작성합니다.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상적으로 동작했다면 어떤 결과가 나와야 하는지 설명합니다.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Codex 클라이언트
      options:
        - Codex App
        - Codex CLI
        - 잘 모르겠습니다
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 사용 중인 버전과 설치 방식을 작성합니다. 확인하기 어려운 항목은 모름으로 작성할 수 있습니다.
      placeholder: |
        macOS:
        Node.js:
        Codex 버전:
        CCUH 버전:
        설치 방식 (마켓플레이스 플러그인 또는 수동 등록):
    validations:
      required: true
  - type: textarea
    id: window_context
    attributes:
      label: 창 상태와 사용자 조작 상황
      description: 관련이 있다면 키보드와 마우스 사용 여부, 대상 창이 다른 데스크탑이나 전체 화면에 있었는지, 최소화됐는지 작성합니다. 창 이름은 익명으로 작성합니다.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: 진단 결과와 로그
      description: 확인할 수 있다면 비공개 내용을 가린 ccuh_status 또는 ccuh_recent_calls 결과를 첨부합니다. 훅 신뢰 승인과 클라이언트 재시작 여부, MCP 연결 실패인지 연결 후 기록이 없는 상태인지 함께 작성합니다.
      render: text
    validations:
      required: false

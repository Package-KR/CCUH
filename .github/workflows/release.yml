name: Release

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
      repair_tag:
        description: Existing tag to publish again without a version increment
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ccuh-release
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Choose release
        id: plan
        env:
          REPAIR_TAG: ${{ inputs.repair_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -n "$REPAIR_TAG" ]]; then
            if [[ ! "$REPAIR_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "A stable vMAJOR.MINOR.PATCH tag is required." >&2
              exit 1
            fi
            git checkout --detach "refs/tags/$REPAIR_TAG"
            version="$(node scripts/release.mjs check)"
            if [[ "$REPAIR_TAG" != "v$version" ]]; then
              echo "The existing tag does not match its package version." >&2
              exit 1
            fi
            echo "mode=reuse" >> "$GITHUB_OUTPUT"
          else
            version="$(node scripts/release.mjs check)"
            tagged="$(git rev-parse --verify "refs/tags/v$version^{commit}" 2>/dev/null || true)"
            subject="$(git log -1 --format=%s)"
            author="$(git log -1 --format=%ae)"
            if [[ "$EVENT_NAME" == "push" && "$tagged" == "$(git rev-parse HEAD)" &&
                  "$subject" == "chore: release v$version [skip ci]" &&
                  "$author" == "41898282+github-actions[bot]@users.noreply.github.com" ]]; then
              echo "mode=reuse" >> "$GITHUB_OUTPUT"
            else
              echo "mode=build" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Increment version
        if: steps.plan.outputs.mode == 'build'
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: node scripts/release.mjs bump "$BUMP"

      - name: Verify and build
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          npm run typecheck
          npm run build
          node scripts/release.mjs check
          git diff --check
          if [[ "$MODE" == "reuse" ]]; then
            git diff --exit-code -- dist
            if [[ -n "$(git ls-files --others --exclude-standard -- dist)" ]]; then
              echo "The existing release is missing built runtime files." >&2
              exit 1
            fi
          fi

      - name: Commit version and publish refs
        id: release
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          version="$(node scripts/release.mjs check)"
          tag="v$version"
          if [[ "$MODE" == "build" ]]; then
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package.json package-lock.json .codex-plugin/plugin.json src/diagnostics.ts dist
            git diff --cached --check
            git commit -m "chore: release $tag [skip ci]"
            git tag -a "$tag" -m "CCUH $tag"
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag:refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$RELEASE_COMMIT" ]]; then
            echo "The release tag does not point to the verified commit." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" --title "CCUH $RELEASE_TAG" --generate-notes
          fi

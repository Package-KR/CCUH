name: CI

'on':
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    outputs:
      commit:
        description: Commit verified by CI
        value: ${{ jobs.verify.outputs.commit }}

permissions:
  contents: read

concurrency:
  group: ccuh-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check types
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Check hook entry syntax
        run: |
          node --check hooks/receiver.mjs
          node --check hooks/result.mjs

      - name: Check Computer Use runtime
        run: |
          node scripts/build-runtime.mjs --check
          node --check dist/recognition/runtime.js

      - name: Prepare read-only environment collector
        run: |
          node --check scripts/build-environment.mjs
          node scripts/build-environment.mjs

      - name: Check formatting
        run: npx --yes prettier@3.7.4 --check .

      - name: Check release metadata
        run: node scripts/release.mjs check

      - name: Record verified commit
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

name: CI

'on':
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    outputs:
      commit:
        description: Commit verified by CI
        value: ${{ jobs.verify.outputs.commit }}

permissions:
  contents: read

concurrency:
  group: ccuh-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Prepare Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: cargo +stable fmt --all -- --check

      - name: Check Rust code
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Build native binaries
        run: cargo +stable build --locked --release --bins

      - name: Check release metadata
        run: target/release/ccuh-release check

      - name: Package verified hook
        run: tar -czf ccuh-hook-x86_64-apple-darwin.tar.gz -C target/release ccuh-hook

      - name: Upload verified hook artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccuh-hook-x86_64-apple-darwin
          path: ccuh-hook-x86_64-apple-darwin.tar.gz
          if-no-files-found: error

      - name: Record verified commit
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

[package]
name = "ccuh"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "A macOS companion for reliable Codex Computer Use."
repository = "https://github.com/Package-KR/CCUH"

[[bin]]
name = "ccuh-hook"
path = "src/main.rs"

[dependencies]
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
